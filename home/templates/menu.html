{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" type="text/css" href="{% static 'menu_styles.css' %}">
        <title>Menu</title>
    </head>
    <body>
        <h1>Menu</h1>
        <ul>
        {% for menu_item in menu %}
            <li>{{menu_item.image}}</li>
            <li>{{menu_item.name}}: ${{menu_item.price}}</li>
            <li></li>
        {% endfor %}
        </ul>
    </body>
    <footer>
        <p>Mon-Fri: 11:00-21:00, Sat-Sun: 10:00-22:00</p>
        <p>2025, %copy Perpex Restaurant Management, All Rights Reserved.</p>
    </footer>
</html>
